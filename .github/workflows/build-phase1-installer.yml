name: Build Windows installer and publish release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v1.1.0"
    paths:
      - ".github/workflows/build-phase1-installer.yml"
      - "README.md"
      - "licenses/**"
      - "THIRD-PARTY-NOTICES.md"
      - "docs/release-*.md"
      - "desktop_app/**"
      - "speech_bubble_editor/**"
      - "web/**"
      - "tests/**"
      - "packaging/**"
      - "requirements*.txt"
      - "build_release.ps1"
      - "SpeechBubbleComicEditorApp.spec"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements-desktop.txt
            requirements-build.txt

      - name: Create build environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check --upgrade pip
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -r requirements-desktop.txt -r requirements-build.txt

      - name: Verify source and regressions
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check pytest
          .\.venv\Scripts\python.exe -m compileall -q desktop_app speech_bubble_editor
          if ($LASTEXITCODE -ne 0) { throw "Python compile checks failed" }
          .\.venv\Scripts\python.exe -m pytest tests -q
          if ($LASTEXITCODE -ne 0) { throw "Python regressions failed" }
          Get-ChildItem web -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax failed: $($_.Name)" }
          }
          Get-ChildItem tests -Filter '*test.cjs' | ForEach-Object {
            node $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript regressions failed: $($_.Name)" }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

      - name: Resolve Inno Setup compiler
        id: iscc
        shell: pwsh
        run: |
          $candidates = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $iscc) {
            throw "Inno Setup 6 compiler (ISCC.exe) was not found."
          }
          "path=$iscc" >> $env:GITHUB_OUTPUT
          Write-Host "Using ISCC: $iscc"

      - name: Build Windows Installer and Portable ZIP
        shell: pwsh
        run: |
          .\build_release.ps1 -Version "1.1.0" -IsccPath "${{ steps.iscc.outputs.path }}"

      - name: Verify release artifacts and SHA-256
        shell: pwsh
        run: |
          $files = @(
            "SpeechBubbleComicEditorApp-v1.1.0-win-x64-setup.exe",
            "SpeechBubbleComicEditorApp-v1.1.0-win-x64-portable.zip"
          )
          $releaseDir = "dist\release"
          $checksumPath = Join-Path $releaseDir "SHA256SUMS.txt"
          if (-not (Test-Path -LiteralPath $checksumPath -PathType Leaf)) { throw "Missing checksum manifest" }
          $expected = @(Get-Content -LiteralPath $checksumPath | Where-Object { $_.Trim() })
          if ($expected.Count -ne $files.Count) { throw "Unexpected checksum manifest entries" }
          foreach ($file in $files) {
            $path = Join-Path $releaseDir $file
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing release file: $path" }
            if ((Get-Item -LiteralPath $path).Length -lt 1048576) { throw "Release artifact unexpectedly small: $file" }
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            if (-not ($expected -contains "$hash  $file")) { throw "SHA-256 mismatch: $file" }
            Write-Host "$hash  $file"
          }
          if ((Get-Content -Raw "desktop_app\version.py") -notmatch 'APP_VERSION = "1\.1\.0"') { throw "App version mismatch" }

      - name: Verify packaged assets, licenses and EXE
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe packaging\verify_distribution.py dist\release\SpeechBubbleComicEditorApp-v1.1.0-win-x64-portable.zip
          if ($LASTEXITCODE -ne 0) { throw "Packaged assets, licenses or EXE verification failed" }

      - name: Verify the Windows installer
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "sbe-install-test"
          $setup = "dist/release/SpeechBubbleComicEditorApp-v1.1.0-win-x64-setup.exe"
          $process = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /NOICONS /DIR=`"$dir`"" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          $exe = Get-Item -LiteralPath (Join-Path $dir "SpeechBubbleComicEditorApp.exe") -ErrorAction Stop
          if ($exe.VersionInfo.ProductVersion -ne "1.1.0.0") { throw "Installed app version mismatch" }
          $report = Join-Path $env:RUNNER_TEMP "sbe-installed-self-test.json"
          $app = Start-Process -FilePath $exe.FullName -ArgumentList "--manga-finish-self-test `"$report`"" -WindowStyle Hidden -Wait -PassThru
          if ($app.ExitCode -ne 0 -or -not (Get-Content -Raw -LiteralPath $report | ConvertFrom-Json).ok) { throw "Installed app self-test failed" }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SpeechBubbleComicEditorApp-v1.1.0-windows
          path: |
            dist/release/SpeechBubbleComicEditorApp-v1.1.0-win-x64-setup.exe
            dist/release/SpeechBubbleComicEditorApp-v1.1.0-win-x64-portable.zip
            dist/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish v1.1.0 as latest stable release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release v1.1.0'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v1.1.0"
          $paths = @(
            "dist/release/SpeechBubbleComicEditorApp-v1.1.0-win-x64-setup.exe",
            "dist/release/SpeechBubbleComicEditorApp-v1.1.0-win-x64-portable.zip",
            "dist/release/SHA256SUMS.txt"
          )
          $refs = gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Release tag lookup failed" }
          $ref = ($refs | ConvertFrom-Json) | Where-Object ref -eq "refs/tags/$tag"
          if ($ref) {
            if ($ref.object.sha -ne $env:GITHUB_SHA) { throw "Existing tag points to another commit" }
          } else {
            gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0) { throw "Release tag creation failed" }
          }
          gh release create $tag @paths --repo $env:GITHUB_REPOSITORY --verify-tag --title "Speech Bubble Comic Editor App v1.1.0" --notes-file "docs/release-1.1.0.md" --latest
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft,assets,tagName --jq '{draft:.isDraft,tag:.tagName,asset_names:[.assets[].name]}'
          if ($LASTEXITCODE -ne 0) { throw "Release verification failed" }
          $latestTag = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.tag_name'
          if ($LASTEXITCODE -ne 0 -or $latestTag -ne $tag) { throw "Latest stable release mismatch" }
