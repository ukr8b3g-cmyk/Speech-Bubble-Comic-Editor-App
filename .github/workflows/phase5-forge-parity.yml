name: Phase 5 Forge parity validation

on:
  push:
    branches: [phase5-forge-parity-20260816]
    paths:
      - .github/workflows/phase5-forge-parity.yml

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify clean baseline
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git fetch origin main
          git merge-base --is-ancestor b24f419ae9be2cdb435b9593f01cdacbee036f43 HEAD
          test -f AGENTS.md
          cat AGENTS.md

      - name: Fetch verified Forge 0.7.10 source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/ukr8b3g-cmyk/Speech-Bubble-Comic-Editor-for-Forge-Neo.git ../forge-source
          git -C ../forge-source checkout 364b8426d316c6282dde620404ef24249a4db409 -- web/project-editor.html

      - name: Apply Phase 5 migration
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/phase5_apply.py.gz.b64 <<'B64'
          
          B64
          base64 -d /tmp/phase5_apply.py.gz.b64 | gzip -d > /tmp/phase5_apply.py
          python -m py_compile /tmp/phase5_apply.py
          APP_ROOT="$PWD" FORGE_ROOT="$PWD/../forge-source" python /tmp/phase5_apply.py

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt pytest

      - name: Static and Python validation
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.cjs; do
            case "$f" in *browser*) continue;; esac
            echo "== $f =="
            node "$f"
          done
          find web -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          python -m compileall -q desktop_app speech_bubble_editor tests
          python -m pytest -q tests/test_*.py
          git diff --check

      - name: Install Chromium test runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Browser regression validation
        shell: bash
        run: |
          set -euo pipefail
          node tests/page_images_id_reuse_browser_smoke.cjs
          node tests/quick_retouch_browser_smoke.cjs
          node tests/quick_retouch_comic_browser_smoke.cjs

      - name: Commit validated Phase 5 changes only
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/phase5-forge-parity.yml
          rm -rf node_modules package-lock.json package.json .pytest_cache
          git status --short
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Phase 5: align standalone behavior with Forge 0.7.10"
          git push origin HEAD:phase5-forge-parity-20260816
