name: Phase 1 migration bootstrap

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import v0.1.8 baseline and establish app identity
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_REPO="https://github.com/ukr8b3g-cmyk/Speech-Bubble-4koma-Editor.git"
          SOURCE_COMMIT="af7f79d896823f39f19fa936602317e39164a827"
          SOURCE_DIR="${RUNNER_TEMP}/speech-bubble-4koma-source"

          git clone --no-checkout "${SOURCE_REPO}" "${SOURCE_DIR}"
          git -C "${SOURCE_DIR}" fetch --depth 1 origin "${SOURCE_COMMIT}"
          git -C "${SOURCE_DIR}" checkout --detach "${SOURCE_COMMIT}"
          test "$(git -C "${SOURCE_DIR}" rev-parse HEAD)" = "${SOURCE_COMMIT}"

          rsync -a --exclude='.git' "${SOURCE_DIR}/" ./

          # The bootstrap workflow is intentionally one-shot.
          rm -f .github/workflows/phase1-bootstrap.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          mv SpeechBubble4komaEditor.spec SpeechBubbleComicEditorApp.spec
          mv packaging/SpeechBubble4komaEditor.iss packaging/SpeechBubbleComicEditorApp.iss
          mv web/assets/speech-bubble-4koma.ico web/assets/speech-bubble-comic-editor-app.ico

          python - <<'PY'
          from pathlib import Path

          replacements = (
              ("Speech Bubble 4koma Editor", "Speech Bubble Comic Editor App"),
              ("SpeechBubble4komaEditor", "SpeechBubbleComicEditorApp"),
              ("speech-bubble-4koma.ico", "speech-bubble-comic-editor-app.ico"),
              ("SpeechBubbleEditorDesktop", "SpeechBubbleComicEditorApp"),
              (
                  "https://github.com/ukr8b3g-cmyk/Speech-Bubble-4koma-Editor",
                  "https://github.com/ukr8b3g-cmyk/Speech-Bubble-Comic-Editor-App",
              ),
          )

          text_suffixes = {
              ".py", ".js", ".html", ".css", ".md", ".txt", ".cmd", ".ps1",
              ".spec", ".iss", ".json", ".ini", ".toml", ".yml", ".yaml",
          }

          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path.suffix.lower() not in text_suffixes and path.name not in {"LICENSE"}:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8", newline="")

          # The successor must install and run independently from the predecessor.
          iss = Path("packaging/SpeechBubbleComicEditorApp.iss")
          text = iss.read_text(encoding="utf-8")
          text = text.replace(
              "92DFBD37-CA51-4F1B-B890-7CC15D830FCE",
              "37342494-2D3C-47DD-85FE-6C683D98D37D",
          )
          iss.write_text(text, encoding="utf-8", newline="")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          title = "# Speech Bubble Comic Editor App\n"
          phase_note = (
              "\n> **Migration status:** Phase 1 baseline. This repository starts from "
              "Speech Bubble 4koma Editor v0.1.8 / commit `af7f79d896823f39f19fa936602317e39164a827`. "
              "Forge Neo 0.7.x editing features will be integrated in later phases.\n"
          )
          if title in text and "**Migration status:** Phase 1 baseline." not in text:
              text = text.replace(title, title + phase_note, 1)

          download_heading = "## ダウンロード"
          start_heading = "## 起動"
          start = text.find(download_heading)
          end = text.find(start_heading, start + 1) if start >= 0 else -1
          if start >= 0 and end > start:
              replacement = (
                  "## 配布状況\n\n"
                  "後継版は現在移植作業中で、Phase 1では新しいインストーラー／EXEをまだ公開していません。\n\n"
                  "移植元の安定版は [Speech Bubble 4koma Editor v0.1.8]"
                  "(https://github.com/ukr8b3g-cmyk/Speech-Bubble-4koma-Editor/releases) です。\n\n"
              )
              text = text[:start] + replacement + text[end:]

          history_heading = "## 開発経緯\n"
          predecessor = (
              "\nこのリポジトリは [Speech Bubble 4koma Editor]"
              "(https://github.com/ukr8b3g-cmyk/Speech-Bubble-4koma-Editor) の後継アプリです。"
              "Phase 1ではv0.1.8のスタンドアロン機能とプロジェクト互換性を維持したまま、"
              "製品・実行ファイル・保存領域を独立させています。\n"
          )
          if history_heading in text and "の後継アプリです。" not in text:
              text = text.replace(history_heading, history_heading + predecessor, 1)
          readme.write_text(text, encoding="utf-8", newline="")
          PY

          cat > AGENTS.md <<'EOF'
          # Repository instructions

          Scope: entire repository.

          - This repository is the standalone successor to `Speech-Bubble-4koma-Editor`.
          - Phase 1 baseline is upstream commit `af7f79d896823f39f19fa936602317e39164a827` (v0.1.8 series).
          - Forge feature source is `Speech-Bubble-Comic-Editor-for-Forge-Neo`; port editing behavior, not Forge host adapters.
          - Preserve the standalone Windows/pywebview architecture, `.sbeproj` compatibility, and the three existing workspaces.
          - Keep the predecessor repository unchanged. Do not replace Desktop APIs with Forge routes/settings/launchers.
          - Before changes, inspect `git status` and preserve unrelated or uncommitted work.
          - Prefer focused phase commits. Run Python compile checks, JavaScript syntax checks, and relevant targeted tests after changes.
          EOF

          cat > MIGRATION_PHASES.md <<'EOF'
          # Speech Bubble Comic Editor App migration phases

          ## Phase 1 — Standalone successor baseline

          - Import the Speech Bubble 4koma Editor v0.1.8-series baseline at `af7f79d896823f39f19fa936602317e39164a827`.
          - Rename the standalone product, executable/build files, icon path, installer identity, Windows product metadata, mutex/event identity, and local application-data root to Speech Bubble Comic Editor App.
          - Preserve `.sbeproj`, project schema, three workspace modes, save/recovery/export behavior, and existing editing behavior.
          - Do not import Forge-specific adapters or settings integration.

          ## Phase 2 — Shared core fixes

          Port later Forge-side editor bug fixes that are applicable to the standalone app, including image replacement, history/state, and Comic/4-panel core fixes.

          ## Phase 3 — Crop and alignment

          Port non-destructive image crop across Single Image, 4-Panel Manga, and Comic plus multi-selection alignment/distribution.

          ## Phase 4 — Quick Retouch

          Port Quick Retouch and adapt its image input/output, settings, persistence, and application routes to the Desktop APIs.

          ## Phase 5 — Processing diff integration

          Merge only the later Forge-side Background Removal and Comic Conversion improvements that are not already present in the standalone app.

          ## Phase 6 — Regression, packaging, and release preparation

          Run full regression/build validation, reconcile documentation and packaging, and prepare the first successor-app release.
          EOF

      - name: Validate Phase 1 baseline
        shell: bash
        run: |
          set -euo pipefail

          python -m compileall -q desktop_app speech_bubble_editor desktop_launcher.py

          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find web -type f -name '*.js' -print0)

          test -f SpeechBubbleComicEditorApp.spec
          test -f packaging/SpeechBubbleComicEditorApp.iss
          test -f web/assets/speech-bubble-comic-editor-app.ico

          ! grep -R -n -F "Speech Bubble 4koma Editor" desktop_app web packaging build_portable.cmd build_release.ps1 SpeechBubbleComicEditorApp.spec
          ! grep -R -n -F "SpeechBubble4komaEditor" desktop_app web packaging build_portable.cmd build_release.ps1 SpeechBubbleComicEditorApp.spec
          ! grep -R -n -F "SpeechBubbleEditorDesktop" desktop_app

      - name: Commit and push Phase 1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Phase 1: establish Speech Bubble Comic Editor App baseline"
          git push origin HEAD:main
